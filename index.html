<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aphrodite's Snacks - Office Lunch Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase JS SDK (Module CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🔑 UPDATED WITH EUROPE-WEST1 DATABASE URL
    const firebaseConfig = {
      apiKey: "AIzaSyDsqwJNqVHp7moMHka8dT0xllkEYioa2hg",
      authDomain: "office-lunch-orders.firebaseapp.com",
      databaseURL: "https://office-lunch-orders-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "office-lunch-orders",
      storageBucket: "office-lunch-orders.firebasestorage.app",
      messagingSenderId: "186331905102",
      appId: "1:186331905102:web:b876c0fb394d4c36ad971f",
      measurementId: "G-VGZV5SSE6Z"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbOnValue = onValue;
    window.dbPush = push;
    window.dbRemove = remove;
  </script>

  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .modal-backdrop { background-color: rgba(2, 6, 23, 0.85); }
  </style>
</head>
<body class="min-h-screen font-sans antialiased pb-12">

  <!-- TOP HEADER & CUTOFF TIMER BANNER -->
  <header class="bg-slate-900/90 border-b border-amber-500/20 backdrop-blur-md sticky top-0 z-30 shadow-xl">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-xl text-amber-400 font-bold text-xl shadow-inner">
          🥪
        </div>
        <div>
          <h1 class="font-extrabold text-xl tracking-tight text-white flex items-center gap-2">
            Aphrodite's Snacks
          </h1>
          <p class="text-xs text-slate-400 flex items-center gap-2">
            <span class="text-amber-400"><i class="fa-solid fa-phone"></i> 22.776480 / 22.774132</span>
            <span>•</span>
            <span>34D Metochiou St, Lefkosia</span>
          </p>
        </div>
      </div>

      <!-- Prominent Cutoff Countdown Bar -->
      <div class="bg-amber-500/10 border border-amber-500/30 px-5 py-2 rounded-xl flex items-center gap-4 shadow-inner w-full md:w-auto justify-between md:justify-start">
        <div class="text-right">
          <div class="text-[10px] uppercase tracking-wider font-bold text-amber-400">Order Cutoff</div>
          <div id="cutoff-time-display" class="font-bold text-sm text-slate-200">11:30 AM</div>
        </div>
        <div class="h-8 w-px bg-amber-500/30"></div>
        <div class="text-center">
          <div class="text-[10px] uppercase tracking-wider font-bold text-amber-400">Time Remaining</div>
          <div id="timer-display" class="font-black text-2xl font-mono tracking-tight text-amber-400 drop-shadow-[0_0_8px_rgba(245,158,11,0.3)]">00:00:00</div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT COLUMN: ORDER FORM & MENU IMAGE (Lg: 7 cols) -->
    <div class="lg:col-span-7 space-y-6">

      <!-- ORDER FORM CARD -->
      <div class="glass-card rounded-2xl p-6 relative shadow-2xl">
        <div id="form-locked-overlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-md rounded-2xl z-20 flex flex-col items-center justify-center text-white p-6 text-center">
          <i class="fa-solid fa-lock text-5xl mb-3 text-amber-400"></i>
          <h2 class="text-2xl font-bold">Ordering is Closed</h2>
          <p class="text-slate-400 text-sm mt-1">The deadline for today's order has passed.</p>
        </div>

        <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-700/60">
          <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
            <i class="fa-solid fa-cart-plus text-amber-400"></i> Place Your Order
          </h2>
          <span class="text-xs bg-amber-500/10 border border-amber-500/30 text-amber-400 font-medium px-2.5 py-1 rounded-full flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live Sync Enabled
          </span>
        </div>

        <!-- Name Input -->
        <div class="mb-5">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Your Name *</label>
          <input type="text" id="user-name" placeholder="Enter your full name" class="w-full bg-slate-900/80 border border-slate-700/80 text-white rounded-lg px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none">
        </div>

        <!-- Item Selector Box -->
        <div class="bg-slate-900/60 rounded-xl p-4 border border-slate-800 mb-5 space-y-4">
          <div class="font-semibold text-xs text-amber-400 uppercase tracking-wider">Select Item to Add</div>
          
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Menu Item</label>
            <select id="item-select" onchange="handleItemSelectChange()" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
              <!-- Dynamic Options -->
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <!-- Dynamic Size Option -->
            <div id="size-container">
              <label class="block text-xs font-medium text-slate-300 mb-1">Size / Portion</label>
              <select id="size-select" onchange="updateItemPricePreview()" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                <option value="Single" data-price="4.00">Single (€4.00)</option>
                <option value="Double" data-price="6.50">Double (€6.50)</option>
              </select>
            </div>

            <!-- Quantity -->
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Quantity</label>
              <div class="flex items-center">
                <button type="button" onclick="adjustQty(-1)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-l-lg border border-r-0 border-slate-700">-</button>
                <input type="number" id="item-qty" value="1" min="1" max="10" readonly class="w-full text-center border-y border-slate-700 py-2 text-sm bg-slate-900 font-bold text-white">
                <button type="button" onclick="adjustQty(1)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-r-lg border border-l-0 border-slate-700">+</button>
